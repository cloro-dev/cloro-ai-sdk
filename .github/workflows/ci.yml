# Checks each pull request and each push to main. publish.yml runs the same
# checks only when a new version is published, on one Node version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The Node line that publish.yml uses and the current LTS line.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
